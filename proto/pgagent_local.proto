syntax = "proto3";

package pgagentpb;

import "common.proto";

// PgAgentLocal — served on Unix socket /run/pg_agentd.sock.
//
// Only pg_agentc and local tooling connect here. No authentication beyond
// filesystem permissions on the socket.
//
// Field-level validation rules (enforced in Rust handlers, not by
// protovalidate):
//   - slot_name, dest_path, id (where present): min_len 1
//   - wal_file: matches ^([0-9A-F]{24}|[0-9A-F]{8}\.history)$
//   - primary_port: > 0

message NodeRef {
  int32  id       = 1; // pgpool node ID (0-based); -1 means unset
  string hostname = 2;
  int32  pg_port  = 3; // informational; agent uses config-sourced value
  string pg_data  = 4; // informational; same
}

message FailoverRequest {
  NodeRef detached    = 1;
  NodeRef new_main    = 2;
  NodeRef old_primary = 3;
  NodeRef old_main    = 4;
}

message FollowPrimaryRequest {
  NodeRef detached    = 1;
  NodeRef new_primary = 2;
  NodeRef old_main    = 3;
  NodeRef old_primary = 4;
}

message RecoveryRequest {
  NodeRef standby = 1;
  NodeRef primary = 2;
  // When true, recovery_1st_stage skips its replay-marker idempotency
  // check and always runs basebackup. Set by `cluster_recover` because
  // the operator's intent on every `pg_agentctl cluster recover` is
  // "actually reclone now"; pgpool's `recovery_1st_stage_command` path
  // leaves this false so retried hooks still dedup.
  bool bypass_replay_marker = 3;
}

message RemoteStartRequest {
  NodeRef target = 1;
}

message EscalationRequest {}

message RestoreWalRequest {
  string wal_file  = 1; // %f — must match ^([0-9A-F]{24}|[0-9A-F]{8}\.history)$
  string dest_path = 2; // %p — destination path on this standby (absolute, inside PGDATA)
}

message MaintenanceIntent {
  string id            = 1;
  string op            = 2;
  string status        = 3; // "pending" | "done" | "abandoned"
  bytes  payload       = 4;
  int32  attempts      = 5;
  string last_error    = 6;
  string created_at    = 7; // RFC3339Nano UTC
  string updated_at    = 8;
  string next_retry_at = 9; // empty when unset
}

message ListMaintenanceRequest {
  repeated string statuses = 1;
}

message SkippedMaintenanceIntent {
  string path  = 1;
  string error = 2;
}

message ListMaintenanceResponse {
  repeated MaintenanceIntent        intents = 1;
  repeated SkippedMaintenanceIntent skipped = 2;
}

message GetMaintenanceRequest {
  string id = 1; // min_len 1
}

message RetryMaintenanceRequest {
  string id = 1; // min_len 1
}

// Mirrors `pg_agent_core::inflight_ops::InflightOp`. `payload` is the
// JSON-serialised tagged enum (single source of truth on the wire so
// pg_agentctl doesn't need to know each variant's shape — it just
// pretty-prints what it gets). Statuses on the wire: "in_progress" |
// "done" | "abandoned".
message InflightOp {
  string id            = 1;
  string op            = 2;  // payload's `op` tag — "handoff", etc.
  string status        = 3;
  bytes  payload       = 4;  // JSON
  string phase         = 5;
  string started_at    = 6;  // RFC3339Nano UTC
  string updated_at    = 7;
  string completed_at  = 8;  // empty when unset (still in-flight)
  string last_error    = 9;  // empty when unset
}

message SkippedInflightOp {
  string path  = 1;
  string error = 2;
}

message ListInflightOpsRequest {
  // Filter by status. Empty = every status.
  repeated string statuses = 1;
}

message ListInflightOpsResponse {
  repeated InflightOp        ops     = 1;
  repeated SkippedInflightOp skipped = 2;
}

message GetInflightOpRequest {
  string id = 1; // min_len 1
}

// The quorum-commit escape hatch (docs/quorum-commit.md §5): clears
// synchronous_standby_names on the current primary so commits stop
// requiring a standby ack. Journaled; the executor re-arms the moment
// a standby attaches. There is deliberately no permanent-async knob.
message AllowAsyncRequest {}

// Maintenance mode: suspend AUTOMATIC role decisions cluster-wide. The
// HA loop keeps observing and logging, but takes no action — no
// takeover, no fence, no re-point — until resumed. Replicated through
// consensus, so it survives agent restarts and applies to every member,
// which is the whole point: pausing one node's loop would leave the
// others free to depose it.
//
// What pause does NOT do: it does not stop PostgreSQL, does not touch
// replication, and does not protect a primary that dies while paused —
// nothing will promote in its place until an operator resumes. It is
// for planned work where automatic reaction is the hazard (rolling
// maintenance, network surgery, a debugging session on a live cluster).
message SetPauseRequest {
  bool   paused = 1; // true = pause, false = resume
  string reason = 2; // required when pausing; recorded for incident review
}

message AbandonInflightOpRequest {
  string id     = 1; // min_len 1
  string reason = 2; // free-form operator note; preserved in last_error
}

message ResumeInflightOpRequest {
  string id = 1; // min_len 1
}

message ClusterInitRequest {
  optional int32 only_node_id = 1;
}

message ClusterInitStandbyResult {
  int32  node_id  = 1;
  string hostname = 2;
  bool   ok       = 3;
  string message  = 4;
}

message ClusterInitResponse {
  bool                              ok        = 1;
  string                            message   = 2;
  string                            repl_user = 3;
  repeated ClusterInitStandbyResult standbys  = 4;
}

message ClusterStatusRequest {}

// One row per pool member. `reachable=false` means the daemon couldn't
// reach the peer (or itself, for the local entry); `error` carries the
// human-readable reason; `status` is the empty default in that case and
// callers should ignore it.
message ClusterStatusEntry {
  int32      node_id   = 1;
  string     hostname  = 2;
  bool       reachable = 3;
  string     error     = 4;
  NodeStatus status    = 5;
}

message ClusterStatusResponse {
  bool                        all_reachable = 1;
  repeated ClusterStatusEntry nodes         = 2;
  // Human-readable maintenance-mode line. Empty means automatic role
  // decisions are live. Otherwise it describes the pause, or says the
  // pause state could not be read — an operator looking at a cluster
  // that is not failing over needs to be told which of those it is,
  // and "" for both would hide exactly the case worth seeing.
  string                      pause_status  = 3;
  // Consensus as this daemon sees it. Absent only when the daemon runs
  // without an HA subsystem at all (unit tests).
  optional ConsensusStatus    consensus     = 4;
}

// The lease, and the machinery that holds it.
//
// The lease decides promotion — it is the authority this whole design
// is built around — and for several releases no operator surface
// rendered it at all. Diagnosing a stuck cluster meant grepping the
// journal for `TookOver`.
message ConsensusStatus {
  // False means the Raft pool has no voters: no leader can ever be
  // elected, every lease read fails, and cold start will refuse to run
  // PostgreSQL on every primary-shaped node. Distinct from "no leader
  // at this instant", which resolves itself in an election.
  bool           membership_formed = 1;
  // Node id Raft currently believes leads. Absent during an election.
  // NOT the PostgreSQL primary — the two are unrelated by design.
  optional int32 raft_leader       = 2;
  // Why the lease could not be read. Non-empty means the lease is
  // UNKNOWN, which is not the same as vacant: `lease` absent with an
  // empty `error` is a genuinely unheld lease. Conflating the two is
  // the hole the consensus module's "Err means unknown" rule exists to
  // close, and rendering must not reintroduce it.
  string         error             = 3;
  optional Lease lease             = 4;
}

message Lease {
  int32  holder = 1;
  // Fencing token — strictly monotonic across holder changes.
  uint64 term   = 2;
  // RFC 3339 instant the holder acquired it.
  string since  = 3;
}

message ClusterRecoverRequest {
  // pgpool node id of the standby to reclone from this primary.
  // The daemon resolves the primary itself (must be the local node).
  int32 target_node_id = 1;

  // Operator opt-in: stop PostgreSQL on the target before basebackup.
  // Without this, a target that still has PG running is refused with
  // an actionable message instead of hitting the deeper basebackup
  // safety check (peerserver.rs `refusing to basebackup while postgres
  // is running`). The CLI surface is `--stop-target-pg` on
  // `pg_agentctl cluster recover`.
  bool stop_target_pg = 2;
}

message ClusterStartPrimaryRequest {
  // Skip the pre-start timeline check. Without it the daemon refuses
  // when any peer reports a STRICTLY HIGHER timeline than the local
  // control file — that peer was promoted past this node, and starting
  // here would resurrect a stale primary and fork the cluster. The
  // check reads peers' timelines whether or not their PostgreSQL is
  // running, so "everything is down" is not an excuse to skip it.
  //
  // The escape hatch exists because a peer can be wrong about itself
  // in ways only an operator can adjudicate; it is not for getting
  // past a refusal you have not read.
  bool force = 1;
}

message ClusterHandoffRequest {
  // pgpool node id of the standby to promote. Must be a healthy
  // standby of the local node — the daemon refuses if the target is
  // already a primary or if its PG isn't running.
  int32 target_node_id = 1;

  // Skip the lag pre-check. Without this, the daemon refuses to
  // promote a target whose replication_lag_bytes exceeds
  // `MAX_HANDOFF_LAG_BYTES` (one WAL segment, 16 MiB) — promoting a
  // lagging standby silently loses the writes between its replay LSN
  // and the old primary's current LSN. CLI surface: `--allow-lag` on
  // `pg_agentctl cluster handoff`.
  bool allow_lag = 2;
}

message GetPgpoolBackendsRequest {}

// One row per pool member. Mirrors `ClusterStatusEntry`'s per-node
// error capture: a single unreachable peer doesn't fail the whole
// RPC — callers decide whether to refuse to render a partial config.
message PgpoolBackendEntry {
  int32  node_id   = 1;
  string hostname  = 2;
  bool   reachable = 3;
  string error     = 4;
  int32  pg_port   = 5; // valid only when reachable
  string pg_data   = 6; // valid only when reachable
}

message GetPgpoolBackendsResponse {
  bool                        all_reachable = 1;
  repeated PgpoolBackendEntry backends      = 2;
}

service PgAgentLocal {
  rpc Failover         (FailoverRequest)         returns (OpResult);
  rpc FollowPrimary    (FollowPrimaryRequest)    returns (OpResult);
  // Hook *script* name on disk stays `recovery_1st_stage` (pgpool-imposed
  // — see hookspec::HOOK_RECOVERY_1ST_STAGE). The RPC is renamed to avoid
  // tonic's ugly `recovery1st_stage` snake_case for a digit-letter boundary.
  rpc RecoveryFirstStage (RecoveryRequest)       returns (OpResult);
  rpc RemoteStart      (RemoteStartRequest)      returns (OpResult);
  rpc Escalation       (EscalationRequest)       returns (OpResult);
  rpc RestoreWal       (RestoreWalRequest)       returns (OpResult);

  rpc GetStatus        (GetStatusRequest)        returns (NodeStatus);
  rpc GetNodeConfig    (NodeConfigRequest)       returns (NodeConfigResponse);

  rpc ClusterInit       (ClusterInitRequest)       returns (ClusterInitResponse);
  rpc ClusterStatus     (ClusterStatusRequest)     returns (ClusterStatusResponse);
  // Operator-initiated standby reclone — delegates to RecoveryFirstStage
  // with the local node as primary. Distinct front door from pgpool's
  // recovery_1st_stage_command hook (which routes through `pg_agentc
  // recovery1`); same orchestration, no PCP creds required.
  rpc ClusterRecover    (ClusterRecoverRequest)    returns (OpResult);
  // Planned primary handoff. Run from the current primary. Promotes the
  // target standby (pg_promote() on the peer), demotes the local node
  // to a standby of the new primary via rewind→basebackup fallback.
  // Distinct from ClusterRecover (which rebuilds a broken target FROM
  // the local primary): handoff REPLACES the local primary WITH the
  // target. Refuses if the target lag exceeds 16 MiB unless `allow_lag`
  // is set.
  rpc ClusterHandoff    (ClusterHandoffRequest)    returns (OpResult);
  // Start the local PostgreSQL as the cluster's primary and claim the
  // lease. The bootstrap case cold start deliberately refuses: a
  // primary-shaped pgdata with a vacant lease stays down, because
  // candidacy needs a running standby's flush position and not a cold
  // ex-primary's assertion. That is the right automatic behaviour and
  // the wrong place to leave an operator, who until now had to reach
  // for systemctl and then wait for the HA loop to notice.
  rpc ClusterStartPrimary (ClusterStartPrimaryRequest) returns (OpResult);
  rpc GetPgpoolBackends (GetPgpoolBackendsRequest) returns (GetPgpoolBackendsResponse);

  rpc ListMaintenance  (ListMaintenanceRequest)  returns (ListMaintenanceResponse);
  rpc GetMaintenance   (GetMaintenanceRequest)   returns (MaintenanceIntent);
  rpc RetryMaintenance (RetryMaintenanceRequest) returns (OpResult);

  // In-flight ops journal — see `pg_agent_core::inflight_ops`. Powers
  // `pg_agentctl ops list/show/abandon/resume`.
  rpc ListInflightOps   (ListInflightOpsRequest)   returns (ListInflightOpsResponse);
  rpc GetInflightOp     (GetInflightOpRequest)     returns (InflightOp);
  rpc AbandonInflightOp (AbandonInflightOpRequest) returns (OpResult);
  rpc ResumeInflightOp  (ResumeInflightOpRequest)  returns (OpResult);

  // Operator escape hatch: disarm quorum commit on the current primary
  // (emergency writes with no standby available). Journaled; auto
  // re-armed on the next standby attach. See AllowAsyncRequest.
  rpc AllowAsync (AllowAsyncRequest) returns (OpResult);

  // Suspend / resume automatic role decisions cluster-wide.
  rpc SetPause (SetPauseRequest) returns (OpResult);
}
