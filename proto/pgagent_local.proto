syntax = "proto3";

package pgagentpb;

import "common.proto";

// PgAgentLocal — served on Unix socket /run/pg_agentd.sock.
//
// Only pg_agentc and local tooling connect here. No authentication beyond
// filesystem permissions on the socket.
//
// Field-level validation rules (enforced in Rust handlers, not by
// protovalidate):
//   - slot_name, dest_path, id (where present): min_len 1
//   - wal_file: matches ^([0-9A-F]{24}|[0-9A-F]{8}\.history)$
//   - primary_port: > 0

message NodeRef {
  int32  id       = 1; // pgpool node ID (0-based); -1 means unset
  string hostname = 2;
  int32  pg_port  = 3; // informational; agent uses config-sourced value
  string pg_data  = 4; // informational; same
}

message FailoverRequest {
  NodeRef detached    = 1;
  NodeRef new_main    = 2;
  NodeRef old_primary = 3;
  NodeRef old_main    = 4;
}

message FollowPrimaryRequest {
  NodeRef detached    = 1;
  NodeRef new_primary = 2;
  NodeRef old_main    = 3;
  NodeRef old_primary = 4;
}

message RecoveryRequest {
  NodeRef standby = 1;
  NodeRef primary = 2;
}

message RemoteStartRequest {
  NodeRef target = 1;
}

message EscalationRequest {}

message RestoreWalRequest {
  string wal_file  = 1; // %f — must match ^([0-9A-F]{24}|[0-9A-F]{8}\.history)$
  string dest_path = 2; // %p — destination path on this standby (absolute, inside PGDATA)
}

message MaintenanceIntent {
  string id            = 1;
  string op            = 2;
  string status        = 3; // "pending" | "done" | "abandoned"
  bytes  payload       = 4;
  int32  attempts      = 5;
  string last_error    = 6;
  string created_at    = 7; // RFC3339Nano UTC
  string updated_at    = 8;
  string next_retry_at = 9; // empty when unset
}

message ListMaintenanceRequest {
  repeated string statuses = 1;
}

message SkippedMaintenanceIntent {
  string path  = 1;
  string error = 2;
}

message ListMaintenanceResponse {
  repeated MaintenanceIntent        intents = 1;
  repeated SkippedMaintenanceIntent skipped = 2;
}

message GetMaintenanceRequest {
  string id = 1; // min_len 1
}

message RetryMaintenanceRequest {
  string id = 1; // min_len 1
}

message ClusterInitRequest {
  optional int32 only_node_id = 1;
}

message ClusterInitStandbyResult {
  int32  node_id  = 1;
  string hostname = 2;
  bool   ok       = 3;
  string message  = 4;
}

message ClusterInitResponse {
  bool                              ok        = 1;
  string                            message   = 2;
  string                            repl_user = 3;
  repeated ClusterInitStandbyResult standbys  = 4;
}

message ClusterStatusRequest {}

// One row per pool member. `reachable=false` means the daemon couldn't
// reach the peer (or itself, for the local entry); `error` carries the
// human-readable reason; `status` is the empty default in that case and
// callers should ignore it.
message ClusterStatusEntry {
  int32      node_id   = 1;
  string     hostname  = 2;
  bool       reachable = 3;
  string     error     = 4;
  NodeStatus status    = 5;
}

message ClusterStatusResponse {
  bool                        all_reachable = 1;
  repeated ClusterStatusEntry nodes         = 2;
}

message ClusterRecoverRequest {
  // pgpool node id of the standby to reclone from this primary.
  // The daemon resolves the primary itself (must be the local node).
  int32 target_node_id = 1;

  // Operator opt-in: stop PostgreSQL on the target before basebackup.
  // Without this, a target that still has PG running is refused with
  // an actionable message instead of hitting the deeper basebackup
  // safety check (peerserver.rs `refusing to basebackup while postgres
  // is running`). The CLI surface is `--stop-target-pg` on
  // `pg_agentctl cluster recover`.
  bool stop_target_pg = 2;
}

message GetPgpoolBackendsRequest {}

// One row per pool member. Mirrors `ClusterStatusEntry`'s per-node
// error capture: a single unreachable peer doesn't fail the whole
// RPC — callers decide whether to refuse to render a partial config.
message PgpoolBackendEntry {
  int32  node_id   = 1;
  string hostname  = 2;
  bool   reachable = 3;
  string error     = 4;
  int32  pg_port   = 5; // valid only when reachable
  string pg_data   = 6; // valid only when reachable
}

message GetPgpoolBackendsResponse {
  bool                        all_reachable = 1;
  repeated PgpoolBackendEntry backends      = 2;
}

service PgAgentLocal {
  rpc Failover         (FailoverRequest)         returns (OpResult);
  rpc FollowPrimary    (FollowPrimaryRequest)    returns (OpResult);
  // Hook *script* name on disk stays `recovery_1st_stage` (pgpool-imposed
  // — see hookspec::HOOK_RECOVERY_1ST_STAGE). The RPC is renamed to avoid
  // tonic's ugly `recovery1st_stage` snake_case for a digit-letter boundary.
  rpc RecoveryFirstStage (RecoveryRequest)       returns (OpResult);
  rpc RemoteStart      (RemoteStartRequest)      returns (OpResult);
  rpc Escalation       (EscalationRequest)       returns (OpResult);
  rpc RestoreWal       (RestoreWalRequest)       returns (OpResult);

  rpc GetStatus        (GetStatusRequest)        returns (NodeStatus);
  rpc GetNodeConfig    (NodeConfigRequest)       returns (NodeConfigResponse);

  rpc ClusterInit       (ClusterInitRequest)       returns (ClusterInitResponse);
  rpc ClusterStatus     (ClusterStatusRequest)     returns (ClusterStatusResponse);
  // Operator-initiated standby reclone — delegates to RecoveryFirstStage
  // with the local node as primary. Distinct front door from pgpool's
  // recovery_1st_stage_command hook (which routes through `pg_agentc
  // recovery1`); same orchestration, no PCP creds required.
  rpc ClusterRecover    (ClusterRecoverRequest)    returns (OpResult);
  rpc GetPgpoolBackends (GetPgpoolBackendsRequest) returns (GetPgpoolBackendsResponse);

  rpc ListMaintenance  (ListMaintenanceRequest)  returns (ListMaintenanceResponse);
  rpc GetMaintenance   (GetMaintenanceRequest)   returns (MaintenanceIntent);
  rpc RetryMaintenance (RetryMaintenanceRequest) returns (OpResult);
}
