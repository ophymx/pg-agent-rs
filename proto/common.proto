syntax = "proto3";

package pgagentpb;

// OpResult is returned by all non-streaming operations.
message OpResult {
  bool   ok      = 1;
  string message = 2; // human-readable error or status
}

// OpProgress is streamed by long-running data-directory operations.
message OpProgress {
  int64  bytes_done  = 1;
  int64  bytes_total = 2; // 0 when unknown
  string phase       = 3; // e.g. "streaming", "rewinding", "done"
  string message     = 4;
}

// NodeStatus describes the current state of the local PostgreSQL instance.
// `is_postgres_running` / `is_pgpool_running` carry the actual systemd active
// state when their `_status_ok` companion is true, and a default `false`
// when the agent could not reach systemd. Treat them as "stopped" only when
// the corresponding `_status_ok` is true; otherwise the field is unknown.
message NodeStatus {
  bool   is_running              = 1;
  bool   is_in_recovery          = 2; // true = standby, false = primary
  bool   is_ready                = 3; // accepting connections AND every readiness probe succeeded
  int64  replication_lag_bytes   = 4; // 0 if primary or unknown
  string replication_state       = 5; // "streaming", "catchup", "" (primary)
  bool   is_postgres_running     = 6;
  bool   is_pgpool_running       = 7;
  bool   is_postgres_status_ok   = 8;
  bool   is_pgpool_status_ok     = 9;
  // Current PostgreSQL timeline derived from the live WAL filename
  // (pg_walfile_name(pg_current_wal_lsn()) on a primary, the replay
  // equivalent on a standby). 0 = unknown / probe failed / peer is on
  // a pre-feature build; treat 0 as "no evidence" for cross-peer
  // comparison. Used by the startup phantom-primary check to detect a
  // returned-primary that was promoted past during its absence.
  int32  timeline_id             = 10;
  // Current write-ahead log position as a 64-bit value
  // (high 32 bits | low 32 bits of pg_lsn). Populated from
  // pg_current_wal_lsn() on a primary, pg_last_wal_replay_lsn() on a
  // standby. 0 = unknown / probe failed / pre-feature peer. Used by
  // `pg_agentctl cluster status` to disambiguate which primary is the
  // most-up-to-date in a split-brain (`(timeline_id, current_wal_lsn)`
  // lex order — higher TL wins, ties broken by higher LSN).
  uint64 current_wal_lsn         = 11;
  // Durably-flushed WAL position (docs/quorum-commit.md §4): on a
  // primary pg_current_wal_lsn(); on a standby the greatest of
  // pg_last_wal_receive_lsn() / pg_last_wal_replay_lsn() — WAL a
  // standby has FLUSHED but not yet replayed is still WAL it owns,
  // and under quorum commit the acknowledged-write guarantee attaches
  // to flushed WAL, so candidate selection compares this field, not
  // current_wal_lsn (replay misclassifies a flush-complete standby as
  // lagging — testing/README.md finding 19). 0 = unknown.
  uint64 last_flush_lsn          = 12;
}

message GetStatusRequest {}
message NodeConfigRequest {}

message NodeConfigResponse {
  int32  pg_port     = 1;
  string pg_data_dir = 2;
}
