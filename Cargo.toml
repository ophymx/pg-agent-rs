[workspace]
resolver = "2"
members = ["crates/*", "testing/acceptance"]

[workspace.package]
version = "0.8.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["pg-agent-rs contributors"]
repository = "https://github.com/ophymx/pg-agent-rs"

[workspace.dependencies]
# Internal
pg-agent-proto    = { path = "crates/pg-agent-proto" }
pg-agent-hookspec = { path = "crates/pg-agent-hookspec" }
pg-agent-core     = { path = "crates/pg-agent-core" }
pgman             = { path = "crates/pgman" }

# Async runtime
tokio        = { version = "1.40", default-features = false }
tokio-util   = { version = "0.7" }
tokio-stream = { version = "0.1", default-features = false }
futures-core = { version = "0.3" }
futures-util = { version = "0.3" }
async-trait  = { version = "0.1" }
bytes        = { version = "1" }

# gRPC / proto
tonic       = { version = "0.12", default-features = false }
prost       = { version = "0.13" }
prost-types = { version = "0.13" }
tonic-build = { version = "0.12" }
# The protoc binary itself, vendored as a build dependency instead of
# required from the host. `cargo build` on a fresh checkout then needs
# nothing but a Rust toolchain — which it previously did not: with no
# system protoc installed, EVERY crate in the workspace failed to compile
# at pg-agent-proto's build script, and the fix was an apt line in CI plus
# a `require protoc` guard in precommit-check.sh to make the error legible.
# Neither is needed now; both are gone.
#
# The vendored binary runs on the BUILD host, so it is unrelated to the
# musl target — but it does assume the build host is a platform
# protoc-bin-vendored ships a binary for (Linux/macOS/Windows on x86_64 or
# aarch64). Building on a host it does not cover means setting PROTOC by
# hand, the same escape hatch prost-build documents.
protoc-bin-vendored = { version = "3" }

# Web (healthz + REST)
axum       = { version = "0.7" }
hyper      = { version = "1" }
hyper-util = { version = "0.1" }
tower      = { version = "0.5" }
http       = { version = "1" }

# TLS
rustls         = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# default-features = false is load-bearing: tokio-rustls's default set
# is ["logging", "tls12", "aws_lc_rs"], and Cargo features are additive
# across the graph — so leaving defaults on here re-enabled
# `rustls/aws_lc_rs` for EVERYONE, silently overriding the explicit
# `ring` choice below and compiling aws-lc-sys (cmake + C) for nothing.
# tonic already declares this dependency correctly; we were the only
# source. Keeping ring as the single crypto backend also leaves ring's
# C/asm as the only native code in the build, which is what makes the
# musl target tractable.
tokio-rustls   = { version = "0.26", default-features = false, features = [
    "logging",
    "tls12",
    "ring",
] }
rustls-pemfile = { version = "2" }
x509-parser    = { version = "0.16" }

# Storage / DB / system
tokio-postgres    = { version = "0.7", default-features = false }
deadpool-postgres = { version = "0.14" }
zbus              = { version = "5", default-features = false, features = ["tokio"] }

# Consensus (docs/promotion-authority.md §5)
# openraft 0.9 is the released line; 0.10 has been in alpha for months and
# pre-1.0 churn is budgeted, not courted. `storage-v2` selects the split
# RaftLogStorage/RaftStateMachine traits — the shape 0.10 makes permanent,
# so the storage impl does not have to be rewritten at upgrade.
openraft = { version = "0.9.25", features = ["serde", "storage-v2"] }
# redb sets the workspace MSRV (1.89). Taking the current line rather than
# the last 1.85-compatible one (2.6.x, now maintenance-only) is cheap here
# because the file is designed to be disposable: on corruption or a format
# break across a major, recovery is `rm -rf <state_dir>/raft/` and let Raft
# re-replicate from peers (promotion-authority §5, "Storage engine").
redb     = { version = "4.1" }

# Config / serde
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
toml       = { version = "0.8" }

# Observability
tracing            = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Misc
arc-swap  = { version = "1.7" }
thiserror = { version = "2" }
anyhow    = { version = "1" }
regex     = { version = "1" }
sha2      = { version = "0.10" }
hex       = { version = "0.4" }
chrono    = { version = "0.4", features = ["serde"] }
rand      = { version = "0.8" }
libc      = { version = "0.2" }
nix       = { version = "0.29", features = ["signal", "fs", "hostname"] }
sd-notify = { version = "0.4" }
tempfile  = { version = "3" }
rcgen     = { version = "0.13" }

# Debug info, not debug *builds*: DWARF is the majority of a debug tree's
# bytes and it is rewritten to disk on every relink. `testing/acceptance`
# is a workspace member, so every acceptance target is another binary
# paying for it.
#
# Line tables, not the full DWARF, for our own crates. `.debug_line` still
# resolves a backtrace frame to `crates/…/foo.rs:214`, so panics,
# `#[should_panic]` and RUST_BACKTRACE read exactly as before. What goes is
# variable and type DWARF — stepping in a debugger and printing locals.
# Reaching for gdb on pg-agent-rs's own code? Build that crate with
# `--config 'profile.dev.debug=2'`.
[profile.dev]
debug = "line-tables-only"

# Dependencies get none at all: nobody steps into tokio, tonic or redb
# from here, and their debug info is the overwhelming majority of it.
# Frames through a dependency still carry symbol names, only not file and
# line.
[profile.dev.package."*"]
debug = false

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
panic         = "abort"
