name: pg-agent-acceptance

# Three systemd-booted nodes, each: PostgreSQL + pg_agentd (from the
# real .deb). Requires a cgroup-v2 host; `privileged` + `cgroup: host`
# is the standard systemd-in-docker recipe.
#
# BASE_IMAGE / PG_VERSION select the matrix cell (testing/matrix.sh);
# the image is TAGGED per cell so cells cannot clobber each other's
# build cache or leave the next run testing the previous OS.

x-node: &node
  image: pg-agent-acceptance:${MATRIX_TAG:-trixie-pg17}
  privileged: true
  cgroup: host
  stop_signal: SIGRTMIN+3
  stop_grace_period: 20s
  tmpfs:
    - /run
    - /run/lock
    - /tmp
  volumes:
    - ./.certs:/certs:ro
  networks:
    - pgnet

services:
  db0:
    <<: *node
    build:
      context: ./docker
      # Two Dockerfiles, not one with branches: the families differ in
      # what repos to add, which packages exist, and which units to
      # mask, and a single file carrying both would be mostly `if`.
      dockerfile: ${DOCKERFILE:-Dockerfile}
      args:
        BASE_IMAGE: ${BASE_IMAGE:-debian:trixie}
        PG_VERSION: ${PG_VERSION:-17}
    hostname: db0
    container_name: pga-db0
  db1:
    <<: *node
    hostname: db1
    container_name: pga-db1
  db2:
    <<: *node
    hostname: db2
    container_name: pga-db2

networks:
  pgnet:
    name: pga-net
