[package]
name        = "pg-agentctl"
description = "pg_agentctl — operator-facing control tool for pg_agent: print-hooks, check-hooks, gen-pgpool, preflight, maintenance {list,show,retry}, cluster init/status/pause/switchover."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[[bin]]
name = "pg_agentctl"
path = "src/main.rs"

[dependencies]
pg-agent-core     = { workspace = true }
pg-agent-proto    = { workspace = true }
pg-agent-hookspec = { workspace = true }

tokio              = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net"] }
tonic              = { workspace = true, features = ["codegen", "prost", "transport", "tls"] }
tower              = { workspace = true, features = ["util"] }
hyper-util         = { workspace = true, features = ["tokio"] }
clap               = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
